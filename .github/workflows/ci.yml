# ---------------------------------------------------------------------------
# Continuous integration for hbtn-devops-pipeline-lab.
#
# HEADS UP: this workflow is DELIBERATELY BROKEN. It ships with three separate
# faults of three different kinds, and repairing them one commit at a time is
# the pipeline-repair task.
#
# Read the run logs in the Actions tab and let them tell you where to look. Do
# not rewrite the file from scratch: the exercise is the diagnosis, not the
# typing. Each fault has its own signature, and fixing one only gets you as far
# as the next.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d pipeline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports
          DATABASE_URL: postgresql://pipeline:pipeline@localhost:5432/pipeline
        run: npm test -- --reporters=default --reporters=jest-junit

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ./reports/
          retention-days: 7

  build:
    name: Build and Publish
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        # GHCR rejects uppercase repository paths, so ghcr.io/${{ github.repository }}:${{ github.sha }}
        # and ghcr.io/${{ github.repository }}:latest would fail to push whenever the owner or repo
        # name contains uppercase letters (ours does). This step derives a lowercase equivalent,
        # used below for both the sha and latest tags.
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        run: |
          curl -f -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}'

      - name: Verify staging liveness and database-backed route
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          max_attempts=30
          sleep_seconds=10
          for attempt in $(seq 1 "$max_attempts"); do
            health_code=$(curl -s -o /dev/null -w '%{http_code}' "$STAGING_URL/health" || echo "000")
            items_code=$(curl -s -o /dev/null -w '%{http_code}' "$STAGING_URL/items" || echo "000")
            echo "Attempt $attempt/$max_attempts: /health=$health_code /items=$items_code"
            if [ "$health_code" = "200" ] && [ "$items_code" = "200" ]; then
              echo "Staging is live and the database-backed route responded."
              exit 0
            fi
            sleep "$sleep_seconds"
          done
          echo "Staging did not become healthy within $((max_attempts * sleep_seconds)) seconds."
          exit 1
